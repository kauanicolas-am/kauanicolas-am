<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffee3a;
      }
    </style>
  </head>
  <body>
    <!-- Ótica Nilky, loop de stories feito com a arte aprovada. 9,2 s. Começa e termina só com o fundo. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.2"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="loop"
        data-composition-id="loop"
        data-composition-src="compositions/loop.html"
        data-start="0"
        data-duration="9.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
