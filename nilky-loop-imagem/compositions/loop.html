<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #fdfdfd; }
    #root #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #root #base { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    #root #dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0c0c6e; opacity: 0; }
    #root .ov { position: absolute; }
    #root .ov img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
    #root #bov { left: 32px; top: 441px; width: 451px; height: 313px; }
    #root #pov { left: 477px; top: 456px; width: 603px; height: 496px; opacity: 0; }
    #root .shinemask { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
    #root #bov .shinemask { -webkit-mask-image: url(assets/balao.png); mask-image: url(assets/balao.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
    #root #pov .shinemask { -webkit-mask-image: url(assets/preco.png); mask-image: url(assets/preco.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
    #root .shine { position: absolute; left: 0; top: -60px; width: 110px; height: 700px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); }
    #root .spark { position: absolute; width: 54px; height: 54px; opacity: 0; }
  </style>

  <div id="root" data-composition-id="loop" data-width="1080" data-height="1920">
    <div id="cam" class="clip" data-start="0" data-duration="12">
      <img id="base" src="assets/base.png" alt="Ação Comunitária da Ótica Nilky: exame de vista grátis e óculos a partir de R$ 250,00" />
      <div id="dim"></div>

      <div id="bov" class="ov">
        <img src="assets/balao.png" alt="" />
        <div class="shinemask"><div class="shine" id="bshine"></div></div>
      </div>
      <div id="pov" class="ov">
        <img src="assets/preco.png" alt="" />
        <div class="shinemask"><div class="shine" id="pshine"></div></div>
      </div>

      <svg id="s1" class="spark" style="left:48px;top:470px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg id="s2" class="spark" style="left:420px;top:430px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg id="s3" class="spark" style="left:1000px;top:470px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg id="s4" class="spark" style="left:520px;top:640px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg id="s5" class="spark" style="left:990px;top:880px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg id="s6" class="spark" style="left:300px;top:850px" viewBox="-24 -24 48 48"><path d="M0 -22L5 -5L22 0L5 5L0 22L-5 5L-22 0L-5 -5Z" fill="#fff" stroke="#ff8a00" stroke-width="3" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <script>
    gsap.set("#cam", { scale: 1, x: 0, y: 0, transformOrigin: "50% 50%" });
    gsap.set("#bov", { transformOrigin: "50% 50%" });
    gsap.set("#pov", { transformOrigin: "50% 50%" });
    gsap.set(".shine", { skewX: -18, x: -240 });

    const tl = gsap.timeline({ paused: true });
    const F = (t, a, b, p) => tl.fromTo(t, a, Object.assign({}, b, { immediateRender: false }), p);
    const GLOW0 = "drop-shadow(0 0 0px rgba(255,255,255,0))";
    const GLOW1 = "drop-shadow(0 0 26px rgba(255,255,255,0.95))";

    // câmera: foco no balão (A), no preço (B), volta ao quadro inteiro (C). Quadros 0 e 12 s são iguais.
    F("#cam", { scale: 1, x: 0, y: 0 }, { scale: 1.08, x: 23, y: 29, duration: 0.8, ease: "power2.inOut" }, 0.3);
    F("#cam", { scale: 1.08, x: 23, y: 29 }, { scale: 1.08, x: -19, y: 21, duration: 0.8, ease: "power2.inOut" }, 3.4);
    F("#cam", { scale: 1.08, x: -19, y: 21 }, { scale: 1, x: 0, y: 0, duration: 1.0, ease: "power2.inOut" }, 7.6);
    F("#cam", { scale: 1, x: 0, y: 0 }, { scale: 1.025, duration: 1.6, ease: "sine.inOut" }, 8.7);
    F("#cam", { scale: 1.025 }, { scale: 1, duration: 1.4, ease: "sine.inOut" }, 10.3);

    // escurece o resto da arte para destacar o que está em foco
    F("#dim", { opacity: 0 }, { opacity: 0.3, duration: 0.5, ease: "power1.out" }, 0.3);
    F("#dim", { opacity: 0.3 }, { opacity: 0, duration: 0.7, ease: "power1.inOut" }, 7.6);

    // A: EXAME DE VISTA GRÁTIS (0,3 a 3,7 s)
    F("#bov", { filter: GLOW0 }, { filter: GLOW1, duration: 0.4, ease: "power1.out" }, 0.3);
    for (const s of [1.1, 2.0, 2.9]) {
      F("#bov", { scale: 1 }, { scale: 1.07, duration: 0.22, ease: "power2.out" }, s);
      F("#bov", { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, s + 0.22);
    }
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 1.2);
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 2.6);
    F("#bov", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, 3.5);

    // B: ÓCULOS A PARTIR DE R$ 250,00 (3,9 a 7,6 s)
    F("#pov", { opacity: 0, scale: 0.92, filter: GLOW0 }, { opacity: 1, scale: 1.07, filter: GLOW1, duration: 0.4, ease: "back.out(1.7)" }, 3.9);
    F("#pov", { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 4.3);
    for (const s of [4.9, 5.8, 6.7]) {
      F("#pov", { scale: 1 }, { scale: 1.06, duration: 0.22, ease: "power2.out" }, s);
      F("#pov", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, s + 0.22);
    }
    F("#pshine", { x: -240 }, { x: 800, duration: 1.0, ease: "power1.inOut" }, 5.0);
    F("#pshine", { x: -240 }, { x: 800, duration: 1.0, ease: "power1.inOut" }, 6.4);

    // C: os dois juntos, pulsando em revezamento (7,6 a 11,6 s)
    F("#bov", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 7.7);
    for (const s of [8.9, 10.1]) {
      F("#bov", { scale: 1 }, { scale: 1.06, duration: 0.22, ease: "power2.out" }, s);
      F("#bov", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, s + 0.22);
    }
    for (const s of [9.5, 10.7]) {
      F("#pov", { scale: 1 }, { scale: 1.05, duration: 0.22, ease: "power2.out" }, s);
      F("#pov", { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, s + 0.22);
    }
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 9.0);
    F("#pshine", { x: -240 }, { x: 800, duration: 1.0, ease: "power1.inOut" }, 9.7);
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 10.2);
    F("#bov", { filter: GLOW1 }, { filter: GLOW0, duration: 0.5, ease: "power1.inOut" }, 7.7);
    F("#pov", { filter: GLOW1 }, { filter: GLOW0, duration: 0.5, ease: "power1.inOut" }, 7.7);
    F("#pov", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, 11.4);

    // faíscas (cada uma brilha e some; todas terminam apagadas antes do fim)
    const sp = [["s1", 0.6], ["s2", 1.7], ["s3", 4.2], ["s4", 5.3], ["s5", 6.4], ["s6", 8.2], ["s3", 9.2], ["s1", 10.4]];
    for (const [id, t] of sp) {
      F("#" + id, { scale: 0, rotation: 0, opacity: 1 }, { scale: 1.25, rotation: 90, duration: 0.28, ease: "power2.out" }, t);
      F("#" + id, { scale: 1.25, rotation: 90, opacity: 1 }, { scale: 0, rotation: 180, opacity: 0, duration: 0.27, ease: "power2.in" }, t + 0.28);
    }
    window.__timelines["loop"] = tl;
  </script>
</template>
