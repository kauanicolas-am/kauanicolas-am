  <script>
    gsap.set("#cam", { x: 0, y: 0 });
    gsap.set(".ov", { transformOrigin: "50% 50%" });
    gsap.set(".shine", { skewX: -18, x: -240 });

    const tl = gsap.timeline({ paused: true });
    const F = (t, a, b, p) => tl.fromTo(t, a, Object.assign({}, b, { immediateRender: false }), p);

    // quadro 0 = arte completa (capa). Os três destaques saem voando, o fundo limpo aparece,
    // e cada um é jogado de volta. O quadro 12 volta a ser a arte completa.
    F("#plate", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 1.0);

    const REST = { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 };
    const els = [
      { id: "#bov",  rg: "#rg1", sp: "a", out: { x: -720, y: -380, rotation: -50 }, from: { x: -640, y: -520, rotation: -70 }, t: 1.9, out0: 1.2 },
      { id: "#pov",  rg: "#rg2", sp: "b", out: { x: 760,  y: -320, rotation: 55 },  from: { x: 700,  y: -460, rotation: 75 },  t: 3.9, out0: 1.3 },
      { id: "#mov",  rg: "#rg3", sp: "c", out: { x: 640,  y: 620,  rotation: -55 }, from: { x: 600,  y: 700,  rotation: -80 }, t: 5.9, out0: 1.4 }
    ];

    // saída: cada destaque é arremessado para fora da tela
    for (const e of els) {
      F(e.id, REST, Object.assign({ scale: 0.35, duration: 0.5, ease: "power2.in" }, e.out), e.out0);
      F(e.id, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, e.out0 + 0.3);
    }

    // helper: tremida de câmera depois de cada impacto
    const shake = (t) => {
      const steps = [[10, -8], [-8, 6], [6, -4], [-3, 2], [0, 0]];
      let px = 0, py = 0, tt = t;
      for (const [x, y] of steps) {
        F("#cam", { x: px, y: py }, { x, y, duration: 0.05, ease: "none" }, tt);
        px = x; py = y; tt += 0.05;
      }
    };

    const ang = [-90, -20, 45, 120, 200];
    for (const e of els) {
      const T = e.t, land = T + 0.55;
      // arremesso: vem de longe, grande e girando, acelerando em direção à tela
      F(e.id, Object.assign({ scale: 3.2, opacity: 0 }, e.from), { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.55, ease: "power3.in" }, T);
      F(e.id, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, T);
      // impacto: achata e volta
      F(e.id, { scale: 1 }, { scale: 1.13, duration: 0.1, ease: "power2.out" }, land);
      F(e.id, { scale: 1.13 }, { scale: 0.96, duration: 0.12, ease: "power2.inOut" }, land + 0.1);
      F(e.id, { scale: 0.96 }, { scale: 1, duration: 0.25, ease: "back.out(2.2)" }, land + 0.22);
      // anel de luz e faíscas
      F(e.rg, { scale: 0.3, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.55, ease: "power2.out" }, land);
      for (let i = 0; i < 5; i++) {
        const r = ang[i] * Math.PI / 180, d = 190 + 25 * (i % 2);
        const id = "#" + e.sp + (i + 1);
        F(id, { x: 0, y: 0, scale: 0, rotation: 0, opacity: 1 }, { x: Math.cos(r) * d, y: Math.sin(r) * d, scale: 1.2, rotation: 120, duration: 0.3, ease: "power2.out" }, land);
        F(id, { scale: 1.2, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, land + 0.3);
      }
      shake(land);
    }

    // reflexos de brilho passando
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 2.9);
    F("#pshine", { x: -240 }, { x: 800, duration: 1.0, ease: "power1.inOut" }, 4.9);
    F("#mshine", { x: -240 }, { x: 700, duration: 0.9, ease: "power1.inOut" }, 6.9);

    // com os três no lugar: pulsos em revezamento e brilho (7,6 a 11,2 s)
    const pulse = (id, t, k) => {
      F(id, { scale: 1 }, { scale: k, duration: 0.22, ease: "power2.out" }, t);
      F(id, { scale: k }, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.22);
    };
    pulse("#bov", 7.7, 1.06); pulse("#pov", 8.3, 1.06); pulse("#mov", 8.9, 1.06);
    pulse("#bov", 9.7, 1.05); pulse("#pov", 10.3, 1.05); pulse("#mov", 10.9, 1.05);
    F("#bshine", { x: -240 }, { x: 620, duration: 0.9, ease: "power1.inOut" }, 7.9);
    F("#pshine", { x: -240 }, { x: 800, duration: 1.0, ease: "power1.inOut" }, 8.5);
    F("#mshine", { x: -240 }, { x: 700, duration: 0.9, ease: "power1.inOut" }, 9.1);

    // volta ao quadro inicial: o fundo limpo some por baixo dos destaques, que já estão no lugar
    F("#plate", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none" }, 11.4);

    window.__timelines["loop"] = tl;
  </script>
