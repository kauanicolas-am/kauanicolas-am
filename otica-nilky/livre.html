:root{--bg:#FFFBA9;--navy:#14145C;--blue:#1E6FD0;--blue2:#0E4FB5;--y:#FFE62B;--red:#EE2B2B;--mag:#E5238F;--mag2:#C2147A;--cy:#3FC3D9;--w:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:var(--navy);background:var(--bg);position:relative}
.abs{position:absolute}
.bgsvg{position:absolute;inset:0;width:1080px;height:1920px}
.ht{position:absolute;background-image:radial-gradient(var(--navy) 2.4px,transparent 3px);background-size:17px 17px;opacity:.2}
.topbar{position:absolute;left:0;top:0;width:1080px;height:16px;display:flex}
.topbar i{flex:1}
.mega{position:absolute;left:-36px;top:34px;width:330px;height:290px;transform:rotate(-14deg)}
.pill1{position:absolute;left:338px;top:34px;width:320px;height:122px;background:var(--navy);border:7px solid #fff;border-radius:30px;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:90px;letter-spacing:-.04em;box-shadow:0 10px 0 rgba(20,20,92,.25)}
.pill2{position:absolute;left:262px;top:140px;width:780px;height:132px;background:linear-gradient(180deg,#F0359C,#C2147A);border:7px solid #fff;border-radius:40px;transform:rotate(-1deg);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:92px;letter-spacing:-.045em;text-transform:uppercase;box-shadow:0 10px 0 rgba(20,20,92,.28)}
.people{position:absolute;left:12px;top:520px;width:569px;height:900px;filter:drop-shadow(0 16px 18px rgba(20,20,92,.28))}
.balloon{position:absolute;left:34px;top:290px;width:540px;height:340px;transform:rotate(-6deg)}
.balloon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.balloon .l1{position:absolute;left:34px;top:30px;font-weight:900;font-size:60px;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.balloon .l2{position:absolute;left:34px;top:88px;font-weight:900;font-size:102px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.balloon .l2 em{font-style:normal;color:var(--mag)}
.pr{position:absolute;left:534px;top:296px;width:540px;height:423px;transform:rotate(4deg)}
.pr>svg,.pm>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pr .t,.pm .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pr .a{font-weight:900;font-size:88px;line-height:1;letter-spacing:-.04em}
.pr .b{font-weight:800;font-size:52px;line-height:1.05;margin-top:2px}
.pr .c{font-weight:900;font-size:76px;line-height:1;letter-spacing:-.05em;color:var(--red);margin-top:8px;white-space:nowrap}
.pr .sw{width:320px;height:20px;margin-top:6px}
.pm{position:absolute;left:530px;top:752px;width:540px;height:423px;transform:rotate(-3deg)}
.pm .t{color:#fff;text-shadow:3px 3px 0 var(--navy)}
.pm .a{font-weight:900;font-size:54px;line-height:1;letter-spacing:-.02em}
.pm .b{font-weight:900;font-size:64px;line-height:1.02;letter-spacing:-.045em;text-transform:uppercase;color:var(--y);margin-top:4px}
.pm .c{font-weight:900;font-size:49px;line-height:1.02;letter-spacing:-.045em;text-transform:uppercase;color:var(--y);margin-top:2px}
.wave{position:absolute;left:0;top:1360px;width:1080px;height:420px}
.loc{position:absolute;left:0;top:1408px;width:1080px;text-align:center;color:#fff}
.loc .n{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:46px;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
.loc .n svg{width:54px;height:54px;flex:none}
.loc .s{font-style:italic;font-weight:600;font-size:42px;margin-top:2px;color:#EAF1FF}
.city{position:absolute;left:150px;top:1528px;width:780px;height:70px;background:linear-gradient(180deg,#FFF06A,#FFD21F);border-radius:999px;border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:52px;letter-spacing:-.01em;color:#C2147A;text-transform:uppercase;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.date{position:absolute;left:70px;top:1614px;width:940px;height:116px;background:#fff;border:6px solid var(--y);border-radius:30px;display:flex;align-items:center;gap:22px;padding:0 18px 0 14px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.date .ic{width:84px;height:84px;flex:none;border-radius:18px;background:var(--navy);display:grid;place-items:center}
.date .ic svg{width:56px;height:56px}
.date .tx{display:flex;flex-direction:column;justify-content:center}
.date .tx b{font-weight:900;font-size:56px;line-height:1;letter-spacing:-.035em}
.date .tx span{font-weight:800;font-size:44px;line-height:1.05;color:var(--blue)}
.logos{position:absolute;left:0;top:1752px;width:1080px;height:168px;background:#fff;display:flex;align-items:center;justify-content:center}
.logos img{width:830px;display:block}
