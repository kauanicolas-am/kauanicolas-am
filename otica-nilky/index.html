*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:var(--k);background:var(--y);position:relative}

h1{position:absolute;left:60px;top:160px;font-weight:900;font-size:152px;line-height:.95;letter-spacing:-.045em;text-transform:uppercase}
.burst{position:absolute;left:560px;top:292px;width:450px;height:300px;transform:rotate(-6deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--w);font-weight:900;font-size:84px;letter-spacing:-.045em;line-height:1}
.photo{position:absolute;left:60px;top:590px;width:410px;height:520px;border-radius:36px;overflow:hidden;border:6px solid var(--k);box-shadow:12px 12px 0 var(--k);background:var(--y)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.price{position:absolute;left:505px;top:590px;width:515px;height:285px;background:var(--w);border:6px solid var(--k);border-radius:32px;box-shadow:12px 12px 0 var(--k);padding:26px 28px}
.price .a{font-weight:900;font-size:60px;line-height:1;letter-spacing:-.02em}
.price .b{font-weight:700;font-size:42px;margin-top:6px}
.price .c{font-weight:900;font-size:88px;line-height:1;letter-spacing:-.045em;color:var(--red);margin-top:10px;white-space:nowrap}
.promo{position:absolute;left:505px;top:910px;width:515px;height:200px;background:var(--k);color:var(--y);border-radius:32px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center}
.promo .a{font-weight:700;font-size:42px;color:var(--w)}
.promo .b{font-weight:900;font-size:62px;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase}
.date{position:absolute;left:60px;top:1170px;width:960px;height:150px;background:var(--k);border-radius:32px;display:flex;align-items:center;gap:34px;padding:0 40px}
.date .d{font-weight:900;font-size:112px;letter-spacing:-.05em;color:var(--y);line-height:1}
.date .d small{font-size:48px;letter-spacing:-.02em;color:var(--w);margin-left:4px}
.date .t{display:flex;flex-direction:column;gap:2px}
.date .t b{font-weight:900;font-size:54px;color:var(--w);letter-spacing:-.01em;line-height:1.05}
.date .t span{font-weight:800;font-size:50px;color:var(--y);line-height:1.05}
.loc{position:absolute;left:60px;top:1344px;width:960px;height:302px;background:var(--teal);border:6px solid var(--k);border-radius:32px;padding:22px 34px 0 124px;display:flex;flex-direction:column;align-items:flex-start}
.loc .pin{position:absolute;left:34px;top:34px;width:68px;height:68px}
.loc .a{font-weight:900;font-size:56px;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase}
.loc .b{font-weight:700;font-size:40px;margin-top:6px}
.loc .c{margin-top:14px;background:var(--k);color:var(--y);font-weight:900;font-size:46px;letter-spacing:.02em;padding:8px 28px 10px;border-radius:999px;text-transform:uppercase}
.logos{position:absolute;left:60px;top:1684px;width:960px;height:186px;background:var(--w);border-radius:28px;display:flex;align-items:center;justify-content:center;border:6px solid var(--k)}
.logos img{width:900px;display:block}
</style></head><body>
