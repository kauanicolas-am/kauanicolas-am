*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:var(--navy);background:var(--bg);position:relative}
.bgsvg{position:absolute;inset:0;width:1080px;height:1920px}
.ht{position:absolute;background-image:radial-gradient(var(--navy) 2.4px,transparent 3px);background-size:17px 17px;opacity:.22}
.topbar{position:absolute;left:0;top:0;width:1080px;height:18px;display:flex}

.mega{position:absolute;left:-36px;top:30px;width:330px;height:290px;transform:rotate(-14deg)}

.people{position:absolute;left:12px;top:520px;width:569px;height:900px;filter:drop-shadow(0 16px 18px rgba(12,12,110,.32))}

.pr{position:absolute;left:530px;top:292px;width:550px;height:431px;transform:rotate(4deg)}
.pm{position:absolute;left:528px;top:768px;width:550px;height:431px;transform:rotate(-3deg)}
.pr>svg,.pm>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pr .t,.pm .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pr .a{font-weight:900;font-size:90px;line-height:1;letter-spacing:-.04em}
.pr .b{font-weight:800;font-size:54px;line-height:1.05;margin-top:2px}
.pr .c{font-weight:900;font-size:78px;line-height:1;letter-spacing:-.05em;color:var(--red);margin-top:8px;white-space:nowrap}
.pr .sw{width:330px;height:20px;margin-top:6px}
.pm .t{color:#fff;text-shadow:3px 3px 0 var(--navy)}
.pm .a{font-weight:900;font-size:56px;line-height:1;letter-spacing:-.02em}
.pm .b{font-weight:900;font-size:66px;line-height:1.02;letter-spacing:-.045em;text-transform:uppercase;color:var(--y);margin-top:4px}
.pm .c{font-weight:900;font-size:50px;line-height:1.02;letter-spacing:-.045em;text-transform:uppercase;color:var(--y);margin-top:2px}
.date{position:absolute;left:46px;top:1384px;width:988px;height:116px;background:linear-gradient(180deg,#1A1A96,#0C0C6E);border-radius:30px;display:flex;align-items:center;gap:30px;padding:0 38px;box-shadow:8px 8px 0 #fff}
.date .d{font-weight:900;font-size:92px;letter-spacing:-.05em;color:var(--y);line-height:1}
.date .d small{font-size:42px;letter-spacing:-.02em;color:var(--w);margin-left:4px}
.date .t{display:flex;flex-direction:column}
.date .t b{font-weight:900;font-size:48px;color:var(--w);line-height:1.04}
.date .t span{font-weight:800;font-size:44px;color:var(--y);line-height:1.04}

.loc .pin{position:absolute;left:28px;top:34px;width:66px;height:66px}

.logos img{width:830px;display:block}
