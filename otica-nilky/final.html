<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--bg:#FFFBA9;--line:#FFE522;--y:#FFE62B;--blue:#1E6FD0;--navy:#14145C;--red:#EE2B2B;--mag:#E5238F;--cy:#3FC3D9;--grn:#7BC62D;--org:#F5941E;--pur:#7A3A98;--w:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Inter",sans-serif;color:var(--navy);background:var(--bg);position:relative}
.bgsvg{position:absolute;inset:0;width:1080px;height:1920px}
.ht{position:absolute;background-image:radial-gradient(var(--navy) 2.4px,transparent 3px);background-size:17px 17px;opacity:.2}
.ht.a{left:-20px;top:260px;width:360px;height:360px;-webkit-mask-image:radial-gradient(circle at 0 50%,#000,transparent 70%);mask-image:radial-gradient(circle at 0 50%,#000,transparent 70%)}
.ht.b{right:-20px;top:1000px;width:360px;height:420px;-webkit-mask-image:radial-gradient(circle at 100% 50%,#000,transparent 70%);mask-image:radial-gradient(circle at 100% 50%,#000,transparent 70%)}
.topbar{position:absolute;left:0;top:0;width:1080px;height:16px;display:flex}
.topbar i{flex:1}
.mega{position:absolute;left:-40px;top:26px;width:330px;height:290px;transform:rotate(-14deg)}
.title{position:absolute;left:272px;top:44px;font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.95;text-shadow:5px 5px 0 #fff;color:var(--navy)}
.title .l1{font-size:96px;display:block}
.title .l2{font-size:100px;display:block;margin-left:-4px;margin-top:10px}
.photo{position:absolute;left:30px;top:590px;width:461px;height:721px;border:8px solid var(--navy);border-radius:30px;overflow:hidden;box-shadow:12px 12px 0 var(--navy);background:var(--bg)}
.photo img{width:445px;height:704px;display:block}
.over{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
.btxt{position:absolute;left:78px;top:340px;font-weight:900;font-size:112px;line-height:.96;letter-spacing:-.05em;text-transform:uppercase;color:var(--w)}
.btxt em{font-style:normal;color:var(--y)}
.burst{position:absolute;left:438px;top:480px;width:460px;height:300px;transform:rotate(-8deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--w);font-weight:900;font-size:86px;letter-spacing:-.045em;text-shadow:4px 4px 0 var(--navy)}
.pstar{position:absolute;left:480px;top:714px;width:580px;height:330px;transform:rotate(3deg)}
.pstar svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.price{position:absolute;left:522px;top:750px;width:500px;height:236px;background:var(--w);border:7px solid var(--navy);border-radius:30px;padding:14px 26px;transform:rotate(3deg);box-shadow:8px 8px 0 var(--navy)}
.price .a{font-weight:900;font-size:56px;line-height:1;letter-spacing:-.02em}
.price .b{font-weight:800;font-size:40px;margin-top:2px}
.price .c{font-weight:900;font-size:80px;line-height:1;letter-spacing:-.05em;color:var(--red);margin-top:4px;white-space:nowrap}
.promo{position:absolute;left:444px;top:984px;width:600px;height:290px}
.promo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.promo div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-3deg);color:var(--w);text-shadow:3px 3px 0 var(--navy)}
.promo .a{font-weight:800;font-size:42px;line-height:1}
.promo .b{font-weight:900;font-size:58px;line-height:1;letter-spacing:-.04em;text-transform:uppercase;margin-top:4px}
.date{position:absolute;left:46px;top:1340px;width:988px;height:124px;background:var(--navy);border-radius:30px;display:flex;align-items:center;gap:30px;padding:0 38px;box-shadow:8px 8px 0 #fff}
.date .d{font-weight:900;font-size:98px;letter-spacing:-.05em;color:var(--y);line-height:1}
.date .d small{font-size:44px;letter-spacing:-.02em;color:var(--w);margin-left:4px}
.date .t{display:flex;flex-direction:column}
.date .t b{font-weight:900;font-size:50px;color:var(--w);line-height:1.04}
.date .t span{font-weight:800;font-size:46px;color:var(--y);line-height:1.04}
.loc{position:absolute;left:46px;top:1486px;width:988px;height:186px;background:var(--blue);border:7px solid var(--navy);border-radius:30px;padding:12px 30px 0 120px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:8px 8px 0 var(--navy);color:var(--w)}
.loc .pin{position:absolute;left:28px;top:36px;width:68px;height:68px}
.loc .a{font-weight:900;font-size:41px;line-height:1.05;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
.loc .b{font-weight:700;font-size:34px;margin-top:2px}
.loc .c{margin-top:8px;background:var(--y);color:var(--navy);font-weight:900;font-size:40px;letter-spacing:.02em;padding:4px 24px 6px;border-radius:999px;text-transform:uppercase}
.logos{position:absolute;left:46px;top:1700px;width:988px;height:190px;background:var(--w);border:7px solid var(--navy);border-radius:26px;display:flex;align-items:center;justify-content:center}
.logos img{width:900px;display:block}
</style></head><body>
