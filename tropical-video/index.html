<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #16211a;
      }
    </style>
  </head>
  <body>
    <!-- Tropical Implantes, vertical 1080x1920, 15 s. Quatro cenas em sequência. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="gancho"
        data-composition-id="gancho"
        data-composition-src="compositions/gancho.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="osso"
        data-composition-id="osso"
        data-composition-src="compositions/osso.html"
        data-start="3.4"
        data-duration="4.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="implante"
        data-composition-id="implante"
        data-composition-src="compositions/implante.html"
        data-start="7.6"
        data-duration="4.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="chamada"
        data-composition-id="chamada"
        data-composition-src="compositions/chamada.html"
        data-start="11.8"
        data-duration="4.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
